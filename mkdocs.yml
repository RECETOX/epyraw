site_name: epyraw
site_description: Python wrapper for Thermo Fisher RawFileReader library
site_author: RECETOX
repo_url: https://github.com/RECETOX/epyraw
repo_name: RECETOX/epyraw

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - API Reference:
      - RawFile: api/raw_file.md
      - Models: api/models.md
      - Enums: api/enums.md
  - Examples: examples.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src/epyraw]
          options:
            members_order: alphabetical
            docstring_style: google
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RECETOX/epyraw

[project]
name = "epyraw"
version = "0.1.0"
description = "Python wrapper for Thermo Fisher RawFileReader library - read .raw mass spectrometry files in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pythonnet>=3.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epyraw"]

[project.scripts]
epyraw = "epyraw.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, tighten later
